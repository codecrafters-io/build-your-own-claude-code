name: LSP helpers

on:
  pull_request:
  push:
    branches: [main]

jobs:
  transport-and-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6.1.0
        with:
          go-version: 1.25.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install C client dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev
      - name: Build and check the supplied transport
        working-directory: extension_helpers/lsp_transport
        run: |
          go build ./...
          go vet ./...
      - name: Exercise native clients
        run: python3 extension_helpers/verify_clients.py

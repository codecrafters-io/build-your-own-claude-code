extensions:
  - slug: "skills"
    name: "Skills"
    description_markdown: |-
      In this challenge extension, you'll add support for [Skills][agent-skills] to your Claude Code implementation.

      A skill is a folder of instructions for one specific task. Your agent finds skills on disk and loads one only when it's needed.

      Along the way you'll learn about [progressive disclosure][progressive-disclosure], frontmatter parsing, argument substitution, letting the model choose a skill on its own, and handing one to a subagent.

      [agent-skills]: https://agentskills.io/home
      [progressive-disclosure]: https://agentskills.io/specification#progressive-disclosure

  - slug: "lsp"
    name: "Language Server Protocol"
    description_markdown: |-
      In this challenge extension, you'll add support for [LSP][lsp] to your Claude Code implementation.

      Along the way, you'll learn symbol navigation, document synchronization, and coordinated changes across files.

      [lsp]: https://microsoft.github.io/language-server-protocol/

stages:
  - slug: "yy2"
    name: "Communicate with the LLM"
    difficulty: very_easy
    marketing_md: |-
      In this stage, you'll interact with the provided LLM using an [OpenAI-compatible API](https://openrouter.ai/docs/quickstart#using-the-openrouter-api).

  - slug: "aq1"
    name: "Advertise the read tool"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll add support for advertising the `Read` tool in the request.

  - slug: "md6"
    name: "Execute the read tool"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll add support for detecting tool calls from the LLM's response, and executing the `Read` tool call.

  - slug: "ff2"
    name: "Implement the agent loop"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll add support for the agent loop and handling multiple tool calls.

  - slug: "oz7"
    name: "Implement the write tool"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll add support for the `Write` tool that writes content to files.

  - slug: "oq5"
    name: "Implement the bash tool"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll add support for the `Bash` tool that executes bash commands.

  # Extension: Skills
  - slug: "vh1"
    name: "Advertise skills to the LLM"
    difficulty: medium
    primary_extension_slug: "skills"
    marketing_md: |-
      In this stage, you'll add support for finding skills on disk and injecting their names and descriptions into the system prompt.

  - slug: "jd8"
    name: "Invoke a skill by name"
    difficulty: easy
    primary_extension_slug: "skills"
    marketing_md: |-
      In this stage, you'll add support for the `/skill-name` syntax that loads a single skill's instructions into context.

  - slug: "wd2"
    name: "Pass arguments to a skill"
    difficulty: easy
    primary_extension_slug: "skills"
    marketing_md: |-
      In this stage, you'll add support for substituting `$ARGUMENTS` and positional placeholders into a skill's instructions.

  - slug: "sk5"
    name: "Stack multiple skills"
    difficulty: medium
    primary_extension_slug: "skills"
    marketing_md: |-
      In this stage, you'll add support for invoking several skills in one prompt, with the trailing text passed to each.

  - slug: "tq1"
    name: "Run a script bundled with a skill"
    difficulty: medium
    primary_extension_slug: "skills"
    marketing_md: |-
      In this stage, you'll add support for skills that ship executable scripts alongside their instructions.

  - slug: "gq2"
    name: "Let the model choose a skill"
    difficulty: medium
    primary_extension_slug: "skills"
    marketing_md: |-
      In this stage, you'll add support for the model selecting and loading a skill on its own, with no explicit invocation.

  - slug: "mj2"
    name: "Run a skill in a subagent"
    difficulty: hard
    primary_extension_slug: "skills"
    marketing_md: |-
      In this stage, you'll add support for skills that are handed to a subagent, which works through them and reports back a single answer.

  # Extension: Language Server Protocol
  - slug: "dz5"
    name: "Connect the LSP client"
    difficulty: easy
    primary_extension_slug: "lsp"
    marketing_md: |-
      In this stage, you'll connect the supplied LSP client and read its configuration.

  - slug: "iy3"
    name: "Advertise the LSP tool"
    difficulty: easy
    primary_extension_slug: "lsp"
    marketing_md: |-
      In this stage, you'll advertise the `LSP` tool to the model.

  - slug: "gz6"
    name: "Find the implementation"
    difficulty: medium
    primary_extension_slug: "lsp"
    marketing_md: |-
      In this stage, you'll implement `goToDefinition` so your agent can find the function behind a call.

  - slug: "rb6"
    name: "Find the affected callers"
    difficulty: easy
    primary_extension_slug: "lsp"
    marketing_md: |-
      In this stage, you'll implement `findReferences` to find the callers affected by an API change.

  - slug: "bn2"
    name: "Keep the analysis current"
    difficulty: medium
    primary_extension_slug: "lsp"
    marketing_md: |-
      In this stage, you'll synchronize `Write` edits to keep language-server answers current.

  - slug: "ql9"
    name: "Change an API across files"
    difficulty: medium
    primary_extension_slug: "lsp"
    marketing_md: |-
      In this stage, you'll use your agent to change an API across several files from a single prompt.

slug: "claude-code"
name: "Build your own Claude Code"
short_name: "Claude Code"
release_status: "beta"
description_md: |-
  Build a terminal-based AI coding assistant that reads files, edits code, and runs commands. Learn large language model (LLM) APIs, tool calling, and agent loops.

  Then add Skills and language-server support to find relevant code and complete changes across multiple files.

short_description_md: |-
  Build an AI coding agent with tool calling, Skills, and language-server navigation

completion_percentage: 15

languages:
  - slug: "c"
  - slug: "go"
  - slug: "python"
  - slug: "javascript"
  - slug: "typescript"
  - slug: "rust"
  - slug: "zig"
  - slug: "cpp"
  - slug: "csharp"
  - slug: "java"

marketing:
  difficulty: medium
  sample_extension_idea_title: "Add a WebFetch Tool"
  sample_extension_idea_description:
    "Implement a WebFetch tool that allows the LLM to fetch content from URLs.
    This tool would take a URL as a parameter, make an HTTP request, and return
    the response body, enabling the AI assistant to retrieve information from
    the web."
  frequently_asked_questions:
    - question_markdown: "What exactly will I build?"
      answer_markdown: |-
        You'll build a command-line program in a supported language of your choice. Given a prompt, it calls an LLM, executes the tools the model requests, and returns their results to the model until it produces a final response.

        The six base stages give your agent tools to read files, write changes, and run shell commands. You can ask it to inspect a project, make an edit, and run a command to check the result.

        Two extensions build on that agent:

        * Skills: load reusable task instructions when needed, pass arguments, run bundled scripts, and hand a skill to a subagent.
        * Language Server Protocol (LSP): find definitions and references, synchronize edits, and use those tools to update an API across files.

        You'll finish with a working codebase you can inspect, modify, and extend.
    - question_markdown: "What exactly will I learn?"
      answer_markdown: |-
        In the six base stages, you'll learn how to:

        * Call an LLM API and parse its responses.
        * Describe tools with JSON schemas and dispatch the model's tool calls.
        * Preserve conversation history and feed tool results back into an agent loop.
        * Implement file-reading, file-writing, and shell-command tools.

        The Skills extension covers discovering instructions on disk, loading them on demand, substituting arguments, and running a skill in a separate agent conversation.

        The LSP extension covers symbol navigation and document synchronization. In the final capstone, your agent combines those capabilities with Read, Write, and Bash to change an API and update its callers.
    - question_markdown: "Why should I build such a project?"
      answer_markdown: |-
        Building an agent makes its behavior visible. You can follow a model's tool request into your own code, inspect the result it receives, and see why it takes another step or stops.

        One useful milestone is watching your program read a file, change it, and use feedback to continue working from a single prompt. In the LSP extension, you'll watch the agent follow a symbol across files, update its callers, and run tests to check the result.

        That gives you practical experience for debugging coding agents and experimenting with your own tools and workflows.
    - question_markdown: "What are the pre-requisites for this challenge?"
      answer_markdown: |-
        You should be comfortable programming in one of the supported languages, working with files, and using Git. Familiarity with HTTP requests and JSON will help when you connect to the LLM API.

        You don't need prior experience with LLMs or machine learning. The stages introduce tool calling and agent loops as you build them.

        Each stage describes the required behavior, and automated tests give feedback on your implementation. You'll choose the implementation and work through failures using the test feedback. Both extensions build on the base agent; you can take the LSP extension without completing Skills first.

  testimonials:
    - author_name: "Ananthalakshmi Sankar"
      author_description: "Automation Engineer at Apple"
      author_avatar: "https://codecrafters.io/images/external/testimonials/oxta.jpeg"
